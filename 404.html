<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — Alina Baldan</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&family=Manrope:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--linen:#f5f0ef;--wine:#7a1a24;--ink:#1f1a1a;--mute:#6f6560;--line:rgba(122,26,36,.28)}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Manrope',sans-serif;background:var(--linen);color:var(--ink);
  min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 20px;position:relative;
}
.logo{height:34px;width:auto;margin-bottom:54px}
h1{font-family:'Viaoda Libre',serif;font-weight:400;font-size:clamp(40px,7vw,72px);line-height:1.05}
h1 .script{font-family:'Great Vibes',cursive;display:block;font-size:.6em;color:var(--wine);margin-top:10px}
p{font-size:17px;color:var(--mute);margin:26px 0 36px;max-width:420px;line-height:1.6}
a{
  display:inline-flex;align-items:center;min-height:56px;padding:0 34px;
  font-size:16px;font-weight:500;background:var(--wine);color:var(--linen);text-decoration:none;
}
a:hover{filter:brightness(.9)}
.lace{position:absolute;top:0;left:0;width:200px;opacity:.9;pointer-events:none}
.lace.br{top:auto;left:auto;bottom:0;right:0;transform:rotate(180deg)}
</style>
</head>
<body>
<img class="lace" src="assets/lace-corner.webp" alt="" aria-hidden="true">
<img class="lace br" src="assets/lace-corner.webp" alt="" aria-hidden="true">
<img class="logo" src="assets/logo.png" alt="BALDAN">
<h1>Кадр не найден<span class="script">404</span></h1>
<p>Такой страницы нет — возможно, ссылка устарела. Вернёмся к красивому?</p>
<a href="/">На главную</a>
</body>
</html>
